[project]
name = "media-fetcher"
version = "0.1.0"
description = "Authenticated personal media fetcher powered by yt-dlp"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=45",
  "fastapi>=0.116",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
  "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
